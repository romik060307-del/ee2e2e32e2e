name: Build OHLI iOS 27 Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: OHLI-iOS27-Launcher-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
